<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portfolio</title>
    <meta name="description" content="Personal portfolio tracker backed by Google Sheets" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1 id="title"></h1>
      <div class="top-actions">
        <span id="status" class="muted small" aria-live="polite"></span>
        <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="view" tabindex="-1">
      <p class="muted center pad">Loading…</p>
    </main>

    <nav class="tabs" id="tabs" hidden>
      <button data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" /></svg>
        <span>Overview</span>
      </button>
      <button data-view="retire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20c0-4 3-7 7-7s7 3 7 7M12 13V4M12 4l5 3-5 3" /></svg>
        <span>Goals</span>
      </button>
      <button data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>Transaction</span>
      </button>
    </nav>
  </body>
</html>
