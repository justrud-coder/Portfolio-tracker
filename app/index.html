<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portfolio</title>
    <meta name="description" content="Personal portfolio tracker backed by Google Sheets" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1 id="title"></h1>
      <div class="top-actions">
        <span id="status" class="muted small" aria-live="polite"></span>
        <button id="privacy" class="icon-btn" aria-label="Hide amounts" aria-pressed="false" title="Hide amounts">
          <svg class="eye-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.5-.6 4.9-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="refresh" class="icon-btn" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="view" tabindex="-1">
      <p class="muted center pad">Loading…</p>
    </main>

    <nav class="tabs" id="tabs" hidden>
      <button data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" /></svg>
        <span>Overview</span>
      </button>
      <button data-view="retire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20c0-4 3-7 7-7s7 3 7 7M12 13V4M12 4l5 3-5 3" /></svg>
        <span>Goals</span>
      </button>
      <button data-view="rebalance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 21h10M4 7h16M7 7l-3 7a3 3 0 0 0 6 0zM17 7l-3 7a3 3 0 0 0 6 0z" /></svg>
        <span>Rebalance</span>
      <button data-view="savings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V13M10 19V9M15 19v-4M20 19V6M3 19h18" /></svg>
        <span>Savings</span>
      </button>
      <button data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>Transaction</span>
      </button>
    </nav>
  </body>
</html>
