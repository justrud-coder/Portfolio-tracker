name: Daily snapshot

on:
  schedule:
    # 20:45 UTC every day: 22:45 in Vilnius in winter, 23:45 in summer.
    # A run GitHub delays past midnight still saves under the evening's date.
    - cron: "45 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
        env:
          # Optional: the script defaults to the "Portfolio tracker" sheet.
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
